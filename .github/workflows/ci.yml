name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run pack

      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: streamDeckPlugin
          path: dist/*.streamDeckPlugin
          retention-days: 14
