name: Release

# Push a version tag to publish a release, e.g.:
#   git tag v0.2.0
#   git push origin v0.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Stamp version from tag into manifest
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME}"

      - run: npm run typecheck
      - run: npm test
      - run: npm run pack

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.streamDeckPlugin \
            --title "SimRail MQTT ${GITHUB_REF_NAME}" \
            --generate-notes \
            $([[ "${GITHUB_REF_NAME}" == *-* ]] && echo --prerelease)
